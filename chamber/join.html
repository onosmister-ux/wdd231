<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Join Chamber of Commerce</title>

  <meta name="description" content="Join the Chamber of Commerce to grow your business and access networking opportunities.">
  <meta name="author" content="Onos Adu">

  <!-- OPEN GRAPH -->
  <meta property="og:title" content="Join Chamber of Commerce">
  <meta property="og:description" content="Apply to join the Chamber of Commerce and grow your business through networking and events.">
  <meta property="og:image" content="https://onosmister-ux.github.io/wdd231/images/chamber-preview.jpg">
  <meta property="og:url" content="https://onosmister-ux.github.io/wdd231/chamber/join.html">

  <!-- FAVICON -->
  <link rel="icon" href="images/favicon.ico">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS (MUST BE 2 FILES) -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/join.css">

  <!-- JS -->
  <script defer src="scripts/join.js"></script>
</head>

<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="join.html">Join</a>
  </nav>
</header>

<main class="join-page">

  <!-- FIX: H1 MUST BE INSIDE MAIN -->
  <h1>Join Chamber of Commerce</h1>

  <section class="form-section">

    <h2>Membership Application</h2>

    <form method="get" action="thankyou.html">

      <label>
        First Name
        <input type="text" name="firstname" required autocomplete="given-name">
      </label>

      <label>
        Last Name
        <input type="text" name="lastname" required autocomplete="family-name">
      </label>

      <label>
        Organization Title
        <input type="text" name="orgtitle" pattern="[A-Za-z\-\s]{7,}" autocomplete="organization-title" title="At least 7 characters">
      </label>

      <label>
        Email
        <input type="email" name="email" required autocomplete="email" placeholder="name@example.com">
      </label>

      <label>
        Phone
        <input type="tel" name="phone" required autocomplete="tel">
      </label>

      <label>
        Business Name
        <input type="text" name="business" required autocomplete="organization">
      </label>

      <label>
        Membership Level
        <select name="membership">
          <option value="np">NP Membership</option>
          <option value="bronze">Bronze</option>
          <option value="silver">Silver</option>
          <option value="gold">Gold</option>
        </select>
      </label>

      <label>
        Organization Description
        <textarea name="description" title="Describe your organization"></textarea>
      </label>

      <input type="hidden" id="timestamp" name="timestamp">

      <button type="submit" class="submit-btn">Submit Application</button>

    </form>

  </section>

</main>

<footer>
  <p>&copy; 2026 Chamber of Commerce</p>
</footer>

</body>
</html>
